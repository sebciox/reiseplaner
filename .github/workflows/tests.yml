# Prüft bei jedem Push: Code-Fehler (ESLint), einheitliche Formatierung (Prettier) und alle Playwright-Tests.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Code prüfen (ESLint)
        run: npm run lint
      - name: Formatierung prüfen (Prettier)
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Screenshots bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-ausgaben
          path: tests/out
